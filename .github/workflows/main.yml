name: MaxHost Build

on:
  push:
    branches: [ emt ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest # macOS is required for reliable Swift/Orion builds

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: 'https://github.com/theos/sdks' # Official SDK source
          orion: 'true' # Required for your Tweak.swift

      - name: Build Tweak
        run: |
          export TARGET=iphone:clang:latest:14.0
          # Adjusting path based on your screenshots
          cd SatellaJailed/Tweak && make package FINALPACKAGE=1
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxHost-Satella
          path: SatellaJailed/Tweak/packages/*.deb
