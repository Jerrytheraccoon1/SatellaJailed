name: MaxHost Build

on:
  push:
    branches: [ emt ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Force Install SDK
        run: |
          mkdir -p $HOME/theos/sdks
          # Using a direct raw link with better error handling
          curl -LO https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.tar.xz
          tar -xf iPhoneOS14.5.sdk.tar.xz -C $HOME/theos/sdks
          rm iPhoneOS14.5.sdk.tar.xz

      - name: Build Tweak
        run: |
          export TARGET=iphone:clang:latest:14.0
          make package FINALPACKAGE=1
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxHost-Satella
          path: packages/*.deb
